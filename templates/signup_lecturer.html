<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#800000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Create Lecturer Account — Roll Call</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="flash-stack">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash flash-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
</div>

<div style="max-width:440px; margin:0 auto; padding:60px 20px;">
  <div style="text-align:center; margin-bottom:8px;">
    <a href="{{ url_for('auth.login', role='lecturer') }}" style="font-family:var(--font-mono); font-size:12px; color:var(--ink-soft);">&larr; Back to sign in</a>
  </div>
  <div class="card fade-in" style="padding:32px;">
    <h1 style="font-size:24px; margin-bottom:4px;">Create your lecturer account</h1>
    <p class="sub" style="color:var(--ink-soft); margin-bottom:24px;">An administrator will assign you to your courses after signup.</p>

    <form method="POST">
      <div class="field">
        <label>Full name</label>
        <input type="text" name="full_name" placeholder="e.g. Dr. Engineer Bainomugisha" value="{{ form.full_name|default('') }}" required>
      </div>
      <div class="field">
        <label>Username</label>
        <input type="text" name="username" placeholder="e.g. bainomugisha" value="{{ form.username|default('') }}" required>
      </div>
      <div class="field">
        <label>Email <span style="color:var(--absent);">*</span></label>
        <input type="email" name="email" placeholder="you@mak.ac.ug" value="{{ form.email|default('') }}" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required>
      </div>
      <div class="field">
        <label>Confirm password</label>
        <input type="password" name="confirm" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>
  </div>
</div>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>
</html>
