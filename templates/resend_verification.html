<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#800000">
<title>Resend verification — Roll Call</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-hero">
    <div class="auth-hero-inner">
      <div class="brand-line">Makerere University</div>
      <h2>We Build For The Future</h2>
    </div>
  </div>
  <div class="auth-panel">
    <div class="auth-card fade-in">
      <h1>Resend verification link</h1>
      <p class="sub" style="margin-bottom:24px;">Enter your email and we'll send a new verification link.</p>
      <form method="POST">
        <div class="field">
          <label>Email address</label>
          <input type="email" name="email" value="{{ email|default('') }}" placeholder="you@example.com" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Send link</button>
      </form>
      <p class="auth-switch"><a href="{{ url_for('auth.login') }}">Back to sign in</a></p>
    </div>
  </div>
</div>
</body>
</html>
