{# Original interactive emblem inspired by Makerere's motto "We Build For The Future" —
   a torch (knowledge/enlightenment) over an open book (learning), with radiating rays
   and orbiting rings. This is an original illustration, not the official university crest. #}
<div class="crest">
  <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="flameGrad" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="#C99A2E"/>
        <stop offset="55%" stop-color="#E8BE5D"/>
        <stop offset="100%" stop-color="#FCE7B0"/>
      </linearGradient>
      <linearGradient id="bookGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#7C8CF0"/>
        <stop offset="100%" stop-color="#B9C2E8"/>
      </linearGradient>
    </defs>

    <!-- outer rotating ring of dashes -->
    <g class="ring">
      <circle cx="60" cy="60" r="52" fill="none" stroke="#3A4478" stroke-width="1.4" stroke-dasharray="3 7"/>
    </g>
    <!-- inner counter-rotating ring -->
    <g class="ring2">
      <circle cx="60" cy="60" r="44" fill="none" stroke="#565F94" stroke-width="1" stroke-dasharray="1 6"/>
    </g>

    <!-- radiating rays -->
    <g class="rays" stroke="#E8BE5D" stroke-width="2" stroke-linecap="round">
      <line x1="60" y1="6" x2="60" y2="16"/>
      <line x1="60" y1="104" x2="60" y2="114" opacity="0"/>
      <line x1="21.7" y1="21.7" x2="28.8" y2="28.8"/>
      <line x1="98.3" y1="21.7" x2="91.2" y2="28.8"/>
      <line x1="10" y1="60" x2="20" y2="60"/>
      <line x1="110" y1="60" x2="100" y2="60"/>
      <line x1="21.7" y1="98.3" x2="28.8" y2="91.2" opacity="0"/>
      <line x1="98.3" y1="98.3" x2="91.2" y2="91.2" opacity="0"/>
    </g>

    <!-- three small twinkling stars -->
    <g fill="#E8BE5D">
      <circle class="star" cx="30" cy="42" r="2"/>
      <circle class="star" cx="92" cy="46" r="1.6"/>
      <circle class="star" cx="86" cy="86" r="1.8"/>
    </g>

    <!-- open book -->
    <g transform="translate(60,78)">
      <path d="M-30,-6 C -18,-12 -6,-10 0,-6 L0,10 C -6,6 -18,4 -30,10 Z" fill="url(#bookGrad)"/>
      <path d="M30,-6 C 18,-12 6,-10 0,-6 L0,10 C 6,6 18,4 30,10 Z" fill="#EFF1FF"/>
      <line x1="0" y1="-6" x2="0" y2="10" stroke="#3A4478" stroke-width="1"/>
    </g>

    <!-- torch -->
    <g transform="translate(60,40)">
      <rect x="-4" y="6" width="8" height="24" rx="3" fill="#454F86"/>
      <rect x="-6" y="26" width="12" height="6" rx="2" fill="#3A4478"/>
      <g class="flame">
        <path d="M0,-22 C 8,-14 8,-4 0,2 C -8,-4 -8,-14 0,-22 Z" fill="url(#flameGrad)"/>
        <path d="M0,-14 C 4,-9 4,-2 0,2 C -4,-2 -4,-9 0,-14 Z" fill="#FCE7B0" opacity=".85"/>
      </g>
    </g>
  </svg>
</div>
